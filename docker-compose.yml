version: '3.8'

services:
  app:
    build: .
    # SECURITY: was network_mode: "host" — that shares the host's network
    # namespace directly, bypassing Docker's port isolation entirely for
    # every port the app process opens, and is what forced the db service
    # below to publish 5432 to the host in the first place (the app assumed
    # it could always reach "localhost:5432"). On the default bridge network
    # instead, the app reaches Postgres by service name and only the port it
    # actually needs (3001) is published.
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PGHOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # SECURITY: Run as non-root user (matches Dockerfile USER node, uid=1000)
    user: "1000:1000"
    # SECURITY: Read-only filesystem — app only needs to write nothing at runtime
    # (logs go to stdout, no local file writes needed)
    read_only: true
    tmpfs:
      - /tmp:size=50m,noexec,nosuid,nodev
    # SECURITY: Drop ALL Linux capabilities; add back only what's strictly needed
    cap_drop:
      - ALL
    # SECURITY: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    # SECURITY: Resource limits to prevent DoS / container breakout amplification
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${PGUSER:-marslab_user}
      - POSTGRES_PASSWORD=${PGPASSWORD:-marslab123}
      - POSTGRES_DB=${PGDATABASE:-marslab_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-marslab_user} -d ${PGDATABASE:-marslab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # SECURITY: no ports published to the host — only reachable by the app
    # container over the internal compose network is required. This
    # previously exposed Postgres directly to the internet on any host with a
    # public IP and an open security group, with a weak default password
    # (${PGPASSWORD:-marslab123}) if PGPASSWORD wasn't overridden.
    restart: unless-stopped

volumes:
  postgres_data:
