{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rmt.fullname" . }}-backups
  labels:
    {{- include "rmt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backup.storageSize }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rmt.fullname" . }}-postgres-backup
  labels:
    {{- include "rmt.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              envFrom:
                - secretRef:
                    name: {{ include "rmt.fullname" . }}-postgres-secret
              env:
                - name: PGHOST
                  value: "{{ include "rmt.fullname" . }}-postgres"
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              command:
                - sh
                - -c
                - |
                  set -e
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  FILE="/backups/rmt-${POSTGRES_DB}-${STAMP}.sql.gz"
                  echo "Backing up ${POSTGRES_DB} to ${FILE}..."
                  pg_dump -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$FILE"
                  echo "Backup complete: $(du -h "$FILE" | cut -f1)"
                  echo "Pruning backups older than ${RETENTION_DAYS} days..."
                  find /backups -name 'rmt-*.sql.gz' -mtime "+${RETENTION_DAYS}" -delete
                  echo "Done. Current backups:"
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "rmt.fullname" . }}-backups
{{- end }}
