apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmt.fullname" . }}-app-secret
  labels:
    {{- include "rmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGUSER: {{ .Values.postgres.user | quote }}
  PGPASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  PGDATABASE: {{ .Values.postgres.database | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  REFRESH_SECRET: {{ required "secrets.refreshSecret is required" .Values.secrets.refreshSecret | quote }}
  {{- if .Values.secrets.smtp.enabled }}
  SMTP_PASS: {{ required "secrets.smtp.password is required when smtp.enabled" .Values.secrets.smtp.password | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_ACCESS_KEY: {{ required "minio.accessKey is required when minio.enabled" .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ required "minio.secretKey is required when minio.enabled" .Values.minio.secretKey | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmt.fullname" . }}-postgres-secret
  labels:
    {{- include "rmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmt.fullname" . }}-minio-secret
  labels:
    {{- include "rmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ required "minio.accessKey is required when minio.enabled" .Values.minio.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ required "minio.secretKey is required when minio.enabled" .Values.minio.secretKey | quote }}
{{- end }}
